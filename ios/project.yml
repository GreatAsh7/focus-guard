# XcodeGen spec. On a Mac: `brew install xcodegen`, then `xcodegen` in this folder
# creates FocusGuard.xcodeproj.
name: FocusGuard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FocusGuard:
    type: application
    platform: iOS
    sources:
      - App
      - Common
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.focusguard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FocusWidgets
  FocusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Common
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.focusguard.widgets
